<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Outer Border -->
  <rect x="15" y="15" width="770" height="570" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Inner Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#dcdcdc" stroke-width="1"/>
  
  <!-- Top Left Aditya University logo placeholder -->
  <g transform="translate(60, 50)">
    <!-- Symbol: Blue circle with stylized sun rays inside -->
    <circle cx="40" cy="40" r="25" fill="none" stroke="#003566" stroke-width="2"/>
    <circle cx="40" cy="40" r="18" fill="none" stroke="#d62828" stroke-dasharray="2 2" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="10" fill="#003566"/>
    <!-- Sun rays -->
    <path d="M 40 10 L 40 5 M 40 70 L 40 75 M 10 40 L 5 40 M 70 40 L 75 40" stroke="#003566" stroke-width="2"/>
    <text x="40" y="85" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#003566">ADITYA</text>
    <text x="40" y="96" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5" fill="#003566">UNIVERSITY</text>
  </g>
  
  <!-- Top Right Vertical Banner -->
  <g transform="translate(660, 20)">
    <path d="M 0 0 H 60 V 380 L 30 350 L 0 380 Z" fill="#e2e8f0"/>
    <!-- Vertical Text: "COURSE CERTIFICATE" -->
    <text x="30" y="130" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b" transform="rotate(90, 30, 130)" letter-spacing="3">COURSE</text>
    <text x="30" y="240" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e293b" transform="rotate(90, 30, 240)" letter-spacing="3">CERTIFICATE</text>
  </g>
  
  <!-- Main content area -->
  <g transform="translate(80, 180)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#64748b" font-weight="500">Aug 26, 2025</text>
    
    <text x="0" y="45" font-family="'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#0f172a">Banisetti Aditya</text>
    
    <text x="0" y="80" font-family="'Georgia', 'Times New Roman', serif" font-size="15" fill="#475569" font-style="italic">has successfully completed</text>
    
    <text x="0" y="130" font-family="'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#0f3566">Digital Electronics &amp; Logic Design</text>
    
    <text x="0" y="165" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#475569">
      an online non-credit course authorized by Aditya University and offered through
    </text>
    <text x="0" y="183" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#475569" font-weight="700">
      Coursera
    </text>
  </g>
  
  <!-- Signatures -->
  <g transform="translate(80, 440)">
    <!-- Signature lines & text -->
    <path d="M 0 0 H 120" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" fill="#1e293b" font-weight="600">B.Satya sridevi</text>
    <text x="0" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">Assistant professor</text>
    <text x="0" y="37" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">ECE</text>
    
    <path d="M 140 0 H 260" stroke="#cbd5e1" stroke-width="1"/>
    <text x="140" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" fill="#1e293b" font-weight="600">Y.Y.S.Manogna</text>
    <text x="140" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">Assistant professor</text>
    <text x="140" y="37" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">ECE</text>
    
    <path d="M 280 0 H 400" stroke="#cbd5e1" stroke-width="1"/>
    <text x="280" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" fill="#1e293b" font-weight="600">Bheema Shankar</text>
    <text x="280" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">Assistant professor</text>
    <text x="280" y="37" font-family="'Segoe UI', -apple-system, sans-serif" font-size="8" fill="#64748b">ECE</text>
  </g>
  
  <!-- Verification info -->
  <g transform="translate(480, 500)">
    <text x="260" y="-12" text-anchor="end" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" fill="#64748b">Verify at:</text>
    <text x="260" y="2" text-anchor="end" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" fill="#2563eb" font-weight="600">https://coursera.org/verify/E71HW6BTCPQW</text>
    <text x="260" y="18" text-anchor="end" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" fill="#64748b">
      Coursera has confirmed the identity of this individual and their
    </text>
    <text x="260" y="30" text-anchor="end" font-family="'Segoe UI', -apple-system, sans-serif" font-size="9" fill="#64748b">
      participation in the course.
    </text>
  </g>
</svg>
