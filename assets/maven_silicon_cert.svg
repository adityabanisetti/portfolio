<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <!-- Light grey/white background -->
  <rect width="960" height="680" fill="#f0f2f5"/>

  <defs>
    <!-- Blue diagonal shape -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="960" height="680"/>
    </clipPath>
    <linearGradient id="blueBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#2563a8"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <!-- Watermark pattern -->
    <pattern id="mavenWatermark" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <text x="10" y="100" font-family="sans-serif" font-size="30" font-weight="900" fill="#c0c8d8" opacity="0.25" transform="rotate(-20, 100, 100)">MAVEN</text>
    </pattern>
  </defs>

  <!-- Watermark fill -->
  <rect width="960" height="680" fill="url(#mavenWatermark)"/>

  <!-- Blue left background shape -->
  <polygon points="0,0 320,0 520,680 0,680" fill="url(#blueBg)"/>

  <!-- Green diagonal accent stripe -->
  <polygon points="280,0 360,0 560,680 480,680" fill="url(#greenAccent)" opacity="0.85"/>

  <!-- White main card area -->
  <rect x="300" y="0" width="660" height="680" fill="#f8fafc" opacity="0.9"/>

  <!-- RISC-V badge top-right -->
  <g transform="translate(870, 30)">
    <rect x="-38" y="-20" width="76" height="76" rx="6" fill="#1a3a6b"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="white">RISC-V</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#a0c4ff" letter-spacing="1">TRAINING</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#a0c4ff" letter-spacing="1">PARTNER</text>
  </g>

  <!-- Maven Silicon logo (text-based, centered) -->
  <g transform="translate(600, 95)">
    <!-- Logo box -->
    <rect x="-90" y="-28" width="180" height="56" rx="4" fill="none" stroke="#2563a8" stroke-width="2.5"/>
    <!-- MAVEN text -->
    <text x="0" y="-6" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#2563a8" letter-spacing="4">MAVEN</text>
    <!-- SILICON text -->
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#4caf50" letter-spacing="6">SILICON</text>
  </g>
  <text x="600" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#555" letter-spacing="2">Centre of Excellence in Semicon</text>

  <!-- Horizontal rule -->
  <line x1="340" y1="155" x2="870" y2="155" stroke="#d0d8e8" stroke-width="1"/>

  <!-- CERTIFICATE OF COMPLETION -->
  <text x="608" y="210" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#1a3a6b">CERTIFICATE OF COMPLETION</text>

  <!-- Dotted line rows -->
  <line x1="340" y1="255" x2="870" y2="255" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- This is to certify that -->
  <text x="360" y="285" font-family="'Georgia', serif" font-size="16" font-style="italic" fill="#444">This is to certify that...........................</text>
  <text x="630" y="285" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1a3a6b">Banisetti Aditya</text>

  <line x1="340" y1="310" x2="870" y2="310" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- has successfully completed -->
  <text x="360" y="350" font-family="'Georgia', serif" font-size="16" font-style="italic" fill="#444">has successfully completed .........</text>
  <text x="610" y="350" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1a3a6b">VLSI SoC Design using Verilog HDL</text>

  <line x1="340" y1="375" x2="870" y2="375" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- online course on -->
  <text x="360" y="415" font-family="'Georgia', serif" font-size="16" font-style="italic" fill="#444">online course on .....</text>
  <text x="500" y="415" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1a3a6b">04 Jul 2026</text>
  <text x="650" y="415" font-family="'Georgia', serif" font-size="16" font-style="italic" fill="#aaa">........................</text>

  <line x1="340" y1="435" x2="870" y2="435" stroke="#aaa" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Gold medallion badge -->
  <g transform="translate(115, 460)">
    <!-- Outer dark circle -->
    <circle cx="0" cy="0" r="68" fill="#0a0a0a"/>
    <!-- Gold ring -->
    <circle cx="0" cy="0" r="60" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Dark inner circle -->
    <circle cx="0" cy="0" r="50" fill="#111"/>
    <!-- Text -->
    <text x="0" y="-18" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#ffd700">Celebrating</text>
    <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffd700">15+YEARS</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#ffd700">Of Excellence</text>
    <!-- Small dashes around inner ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- CEO Stamp circle (right side) -->
  <g transform="translate(790, 530)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#2563a8" stroke-width="1.5"/>
    <text x="0" y="-18" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#2563a8" letter-spacing="2">MAVEN SILICON</text>
    <text x="0" y="-6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#2563a8" letter-spacing="1">SOFTECH PVT LTD</text>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#2563a8" letter-spacing="1">BANGALORE</text>
    <!-- Simple signature squiggle -->
    <path d="M-20,22 Q-5,10 10,22 Q20,28 30,20" fill="none" stroke="#555" stroke-width="1.5"/>
  </g>

  <!-- CEO Name -->
  <text x="790" y="592" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">SIVAKUMAR P R</text>
  <text x="790" y="608" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#555">CEO, MAVEN SILICON</text>

  <!-- MSUID -->
  <text x="360" y="650" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666">MSUID : 9921081175........................</text>
</svg>
